version: "3.8"
services:
  meshdash:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: meshdash
    restart: unless-stopped
    ports:
      - "8181:8181"
    volumes:
      - meshdash_data:/app/data
    environment:
      - PUBLIC_MODE=false
    privileged: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8181/api/status')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  meshdash_data:
